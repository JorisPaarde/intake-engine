; PHP upload limits for intake foto's (app-limiet = 5 MB).
; Op cPanel/LiteSpeed geldt .user.ini voor web-requests vanuit public/.
; Zie docs/uploads.md en BL-003.
; memory_limit spiegelt live hosting (512M) zodat deploys dit niet overschrijven.
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 20
memory_limit = 512M
