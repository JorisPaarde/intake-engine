name: Deploy production

# Production is volledig gescheiden van staging: eigen GitHub environment,
# secrets, deploypad, .env, database en storage. Alleen een v*-tag of een
# bewuste handmatige dispatch kan deze workflow starten.
#
# Eerste job "Verify CI green" blokkeert de deploy tenzij ci.yml voor deze
# commit (of de gemergde PR-head met up-to-date base) succesvol was.
#
# SSH: één ControlMaster-verbinding per deploy; rsync en activate hergebruiken
# die multiplexed sessie (minder kans op Hoasted rate-limit / kex reset).
#
# Vereiste environment secrets (production):
#   PRODUCTION_SSH_HOST
#   PRODUCTION_SSH_PORT
#   PRODUCTION_SSH_USER
#   PRODUCTION_SSH_KEY
#   PRODUCTION_DEPLOY_PATH   /home/intakeengine/apps/intake-engine-production
#   PRODUCTION_PHP_BIN      /usr/local/bin/php
#
# Optioneel:
#   SSH_KNOWN_HOSTS       vaste known_hosts-inhoud (voorkomt ssh-keyscan).
#                         Als leeg: fallback op ssh-keyscan met retry/backoff.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Verify CI green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read

    steps:
      - name: Require successful ci.yml for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          SHA="${GITHUB_SHA}"

          echo "Checking CI for commit ${SHA} (event=${GITHUB_EVENT_NAME}, ref=${GITHUB_REF})"

          # Returns 0 if any completed ci.yml run for head_sha has conclusion=success.
          # Optional second arg: event filter (e.g. pull_request).
          has_successful_ci() {
            local head_sha="$1"
            local event_filter="${2:-}"
            local query="per_page=30"
            if [ -n "$event_filter" ]; then
              query="${query}&event=${event_filter}"
            fi

            echo "→ Looking up ci.yml runs for head_sha=${head_sha}${event_filter:+ event=${event_filter}}"
            local payload
            payload="$(gh api "repos/${OWNER}/${REPO}/actions/workflows/ci.yml/runs?head_sha=${head_sha}&${query}")"

            local match
            match="$(echo "$payload" | jq -r '
              [.workflow_runs[]
                | select(.status == "completed" and .conclusion == "success")
                | {id, event, head_sha, html_url, created_at}
              ] | .[0] // empty
            ')"

            if [ -z "$match" ] || [ "$match" = "null" ]; then
              local summaries
              summaries="$(echo "$payload" | jq -r '
                [.workflow_runs[] | "\(.id) event=\(.event) status=\(.status) conclusion=\(.conclusion // "null")"]
                | if length == 0 then "(none)" else .[] end
              ')"
              echo "  No successful ci.yml run found. Seen: ${summaries}"
              return 1
            fi

            echo "  Found successful run: $(echo "$match" | jq -c .)"
            return 0
          }

          # Path A: successful CI directly on the tag / dispatch SHA.
          if has_successful_ci "$SHA"; then
            echo "OK: ci.yml succeeded on exact SHA ${SHA}"
            exit 0
          fi
          echo "No successful ci.yml run on exact SHA ${SHA} — trying associated pull request…"

          # Path B: merge commit (or squash) → associated PR head had green pull_request CI,
          # and the merge was up to date with the base tip (first parent == base at merge).
          PRS_JSON="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${OWNER}/${REPO}/commits/${SHA}/pulls")"

          PR_COUNT="$(echo "$PRS_JSON" | jq 'length')"
          echo "Associated PRs for ${SHA}: ${PR_COUNT}"

          if [ "$PR_COUNT" -eq 0 ]; then
            echo "FAIL: no ci.yml success on ${SHA} and no associated pull request"
            exit 1
          fi

          # Prefer a merged PR; otherwise take the first association.
          PR="$(echo "$PRS_JSON" | jq -c '
            (map(select(.merged_at != null)) | .[0]) // .[0]
          ')"

          PR_NUMBER="$(echo "$PR" | jq -r '.number')"
          HEAD_SHA="$(echo "$PR" | jq -r '.head.sha')"
          BASE_SHA="$(echo "$PR" | jq -r '.base.sha')"
          MERGED_AT="$(echo "$PR" | jq -r '.merged_at // "null"')"
          echo "Using PR #${PR_NUMBER} head_sha=${HEAD_SHA} base.sha=${BASE_SHA} merged_at=${MERGED_AT}"

          if ! has_successful_ci "$HEAD_SHA" "pull_request"; then
            echo "FAIL: no successful ci.yml pull_request run on PR head ${HEAD_SHA}"
            exit 1
          fi

          COMMIT_JSON="$(gh api "repos/${OWNER}/${REPO}/git/commits/${SHA}")"
          PARENT_COUNT="$(echo "$COMMIT_JSON" | jq '.parents | length')"
          FIRST_PARENT="$(echo "$COMMIT_JSON" | jq -r '.parents[0].sha // empty')"
          echo "Commit ${SHA} has ${PARENT_COUNT} parent(s); first_parent=${FIRST_PARENT:-"(none)"}"

          # Merge commit: first parent is the base tip at merge time — require it matches
          # the PR base recorded at merge (API base.sha for a merged PR is that tip).
          if [ "$PARENT_COUNT" -ge 2 ] && [ -n "$FIRST_PARENT" ]; then
            if [ "$FIRST_PARENT" = "$BASE_SHA" ]; then
              echo "OK: merge first parent equals PR base at merge (${FIRST_PARENT})"
              echo "OK: PR #${PR_NUMBER} pull_request CI green on ${HEAD_SHA} and base was up to date"
              exit 0
            fi
            echo "WARN: first parent ${FIRST_PARENT} != PR base.sha ${BASE_SHA} — checking ancestry (head contained base)"
          fi

          # Squash / rebase / single-parent: require PR head contained the base tip
          # (PR was up to date with main), via compare merge-base == base.
          COMPARE_BASE="${FIRST_PARENT:-$BASE_SHA}"
          echo "→ Comparing whether head ${HEAD_SHA} contained base ${COMPARE_BASE}"
          COMPARE_JSON="$(gh api "repos/${OWNER}/${REPO}/compare/${COMPARE_BASE}...${HEAD_SHA}")"
          MERGE_BASE="$(echo "$COMPARE_JSON" | jq -r '.merge_base_commit.sha // empty')"
          STATUS="$(echo "$COMPARE_JSON" | jq -r '.status')"
          echo "  compare status=${STATUS} merge_base=${MERGE_BASE:-"(none)"}"

          if [ "$MERGE_BASE" = "$COMPARE_BASE" ]; then
            echo "OK: head contained base (${COMPARE_BASE} is ancestor of ${HEAD_SHA})"
            echo "OK: PR #${PR_NUMBER} pull_request CI green on ${HEAD_SHA} and PR was up to date with base"
            exit 0
          fi

          # Last resort for squash: tree of tagged commit equals tree of PR head
          # (identical tree ⇒ same tested content).
          TAG_TREE="$(echo "$COMMIT_JSON" | jq -r '.tree.sha')"
          HEAD_COMMIT_JSON="$(gh api "repos/${OWNER}/${REPO}/git/commits/${HEAD_SHA}")"
          HEAD_TREE="$(echo "$HEAD_COMMIT_JSON" | jq -r '.tree.sha')"
          echo "→ Tree check: tag_tree=${TAG_TREE} head_tree=${HEAD_TREE}"
          if [ "$TAG_TREE" = "$HEAD_TREE" ]; then
            echo "OK: tag/dispatch tree equals PR head tree; pull_request CI green on ${HEAD_SHA}"
            exit 0
          fi

          echo "FAIL: PR #${PR_NUMBER} had green CI on ${HEAD_SHA}, but could not prove"
          echo "      the tagged commit ${SHA} was an up-to-date merge of that head"
          echo "      (first_parent/base mismatch, head did not contain base, trees differ)"
          exit 1

  deploy:
    name: Build & deploy naar production
    needs: [verify-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://intake-engine.nl/

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, intl, gd, zip
          coverage: none

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare SSH
        env:
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          CONTROL_PATH="$HOME/.ssh/cm-deploy.sock"
          echo "SSH_CONTROL_PATH=$CONTROL_PATH" >> "$GITHUB_ENV"

          if [ -n "${SSH_KNOWN_HOSTS//[[:space:]]/}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "known_hosts gezet vanuit secret SSH_KNOWN_HOSTS"
          else
            echo "SSH_KNOWN_HOSTS leeg — fallback ssh-keyscan"
            : > ~/.ssh/known_hosts
            ok=0
            for attempt in 1 2 3; do
              if ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>keyscan.err \
                && [ -s ~/.ssh/known_hosts ]; then
                ok=1
                break
              fi
              cat keyscan.err >&2 || true
              : > ~/.ssh/known_hosts
              if [ "$attempt" -lt 3 ]; then
                sleep_for=$(( attempt * 20 ))
                echo "ssh-keyscan mislukt (poging $attempt/3); opnieuw over ${sleep_for}s…"
                sleep "$sleep_for"
              fi
            done
            if [ "$ok" -ne 1 ]; then
              echo "ssh-keyscan mislukt na 3 pogingen"
              exit 1
            fi
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Open SSH ControlMaster
        env:
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          ok=0
          for attempt in 1 2 3; do
            if ssh -fNM \
              -i ~/.ssh/deploy_key \
              -p "$PORT" \
              -o ControlMaster=yes \
              -o "ControlPath=$SSH_CONTROL_PATH" \
              -o ControlPersist=10m \
              -o StrictHostKeyChecking=yes \
              "$USER@$HOST" 2>ssh-master.err; then
              echo "SSH ControlMaster geopend"
              ok=1
              break
            fi
            err="$(cat ssh-master.err 2>/dev/null || true)"
            printf '%s\n' "$err" >&2
            if ! printf '%s\n' "$err" | grep -qiE 'kex_exchange_identification|Connection reset by peer|Connection closed by'; then
              echo "SSH ControlMaster mislukt (geen retrybare fout)"
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep_for=$(( attempt * 30 ))
              echo "SSH ControlMaster kex/reset (poging $attempt/3); opnieuw over ${sleep_for}s…"
              sleep "$sleep_for"
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "SSH ControlMaster mislukt na 3 pogingen"
            exit 1
          fi

      - name: Rsync release naar server
        env:
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          case "$DEPLOY_PATH" in
            */intake-engine-production) ;;
            *) echo "Onveilig production-deploypad: $DEPLOY_PATH"; exit 1 ;;
          esac
          RELEASE="releases/${GITHUB_SHA::12}"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          SSH_BASE=(ssh -i ~/.ssh/deploy_key -p "$PORT" -o "ControlPath=$SSH_CONTROL_PATH" -o ControlMaster=no)
          "${SSH_BASE[@]}" "$USER@$HOST" "mkdir -p '$DEPLOY_PATH/$RELEASE' '$DEPLOY_PATH/shared/storage'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o ControlPath=$SSH_CONTROL_PATH -o ControlMaster=no" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'storage' \
            --exclude '.env*' \
            ./ "$USER@$HOST:$DEPLOY_PATH/$RELEASE/"

      - name: Activeer release (migrate, cache, queue restart)
        env:
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          PHP_BIN: ${{ secrets.PRODUCTION_PHP_BIN }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o "ControlPath=$SSH_CONTROL_PATH" -o ControlMaster=no \
            "$USER@$HOST" \
            "bash '$DEPLOY_PATH/$RELEASE/deploy/activate.sh' '$DEPLOY_PATH' '$RELEASE' '$PHP_BIN' 3 production"

      - name: Verify production health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://intake-engine.nl/health

      - name: Close SSH ControlMaster
        if: always()
        env:
          HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          if [ -n "${SSH_CONTROL_PATH:-}" ]; then
            ssh -O exit -p "$PORT" -o "ControlPath=$SSH_CONTROL_PATH" "$USER@$HOST" || true
          fi
