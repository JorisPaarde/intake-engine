name: Deploy staging

# Strategie: CI bouwt alles (composer + assets), rsynct een release naar de
# server en activeert die atomisch via een symlink. De server heeft alleen
# PHP-CLI, SSH en rsync nodig — geen composer of node.
#
# SSH: één ControlMaster-verbinding per deploy; rsync en activate hergebruiken
# die multiplexed sessie (minder kans op Hoasted rate-limit / kex reset).
#
# Vereiste repository secrets:
#   STAGING_SSH_HOST      bv. server123.hostingprovider.nl
#   STAGING_SSH_PORT      meestal 22 (soms 2222 bij cPanel)
#   STAGING_SSH_USER      cPanel-gebruikersnaam
#   STAGING_SSH_KEY       private key (deploy key, alleen voor dit doel)
#   STAGING_DEPLOY_PATH   bv. /home/USER/apps/intake-engine-staging
#   STAGING_PHP_BIN       bv. /usr/local/bin/php of /opt/cpanel/ea-php83/root/usr/bin/php
#
# Optioneel:
#   SSH_KNOWN_HOSTS       vaste known_hosts-inhoud (voorkomt ssh-keyscan).
#                         Als leeg: fallback op ssh-keyscan met retry/backoff.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy naar staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.intake-engine.nl/

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, intl, gd, zip
          coverage: none

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare SSH
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          CONTROL_PATH="$HOME/.ssh/cm-deploy.sock"
          echo "SSH_CONTROL_PATH=$CONTROL_PATH" >> "$GITHUB_ENV"

          if [ -n "${SSH_KNOWN_HOSTS//[[:space:]]/}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "known_hosts gezet vanuit secret SSH_KNOWN_HOSTS"
          else
            echo "SSH_KNOWN_HOSTS leeg — fallback ssh-keyscan"
            : > ~/.ssh/known_hosts
            ok=0
            for attempt in 1 2 3; do
              if ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>keyscan.err \
                && [ -s ~/.ssh/known_hosts ]; then
                ok=1
                break
              fi
              cat keyscan.err >&2 || true
              : > ~/.ssh/known_hosts
              if [ "$attempt" -lt 3 ]; then
                sleep_for=$(( attempt * 20 ))
                echo "ssh-keyscan mislukt (poging $attempt/3); opnieuw over ${sleep_for}s…"
                sleep "$sleep_for"
              fi
            done
            if [ "$ok" -ne 1 ]; then
              echo "ssh-keyscan mislukt na 3 pogingen"
              exit 1
            fi
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Open SSH ControlMaster
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          PORT: ${{ secrets.STAGING_SSH_PORT }}
          USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          ok=0
          for attempt in 1 2 3; do
            if ssh -fNM \
              -i ~/.ssh/deploy_key \
              -p "$PORT" \
              -o ControlMaster=yes \
              -o "ControlPath=$SSH_CONTROL_PATH" \
              -o ControlPersist=10m \
              -o StrictHostKeyChecking=yes \
              "$USER@$HOST" 2>ssh-master.err; then
              echo "SSH ControlMaster geopend"
              ok=1
              break
            fi
            err="$(cat ssh-master.err 2>/dev/null || true)"
            printf '%s\n' "$err" >&2
            if ! printf '%s\n' "$err" | grep -qiE 'kex_exchange_identification|Connection reset by peer|Connection closed by'; then
              echo "SSH ControlMaster mislukt (geen retrybare fout)"
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep_for=$(( attempt * 30 ))
              echo "SSH ControlMaster kex/reset (poging $attempt/3); opnieuw over ${sleep_for}s…"
              sleep "$sleep_for"
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "SSH ControlMaster mislukt na 3 pogingen"
            exit 1
          fi

      - name: Rsync release naar server
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          PORT: ${{ secrets.STAGING_SSH_PORT }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          case "$DEPLOY_PATH" in
            */intake-engine-staging) ;;
            *) echo "Onveilig staging-deploypad: $DEPLOY_PATH"; exit 1 ;;
          esac
          RELEASE="releases/${GITHUB_SHA::12}"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          SSH_BASE=(ssh -i ~/.ssh/deploy_key -p "$PORT" -o "ControlPath=$SSH_CONTROL_PATH" -o ControlMaster=no)
          "${SSH_BASE[@]}" "$USER@$HOST" "mkdir -p '$DEPLOY_PATH/$RELEASE' '$DEPLOY_PATH/shared/storage'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o ControlPath=$SSH_CONTROL_PATH -o ControlMaster=no" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'storage' \
            --exclude '.env*' \
            ./ "$USER@$HOST:$DEPLOY_PATH/$RELEASE/"

      - name: Activeer release (migrate, cache, queue restart)
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          PORT: ${{ secrets.STAGING_SSH_PORT }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          PHP_BIN: ${{ secrets.STAGING_PHP_BIN }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o "ControlPath=$SSH_CONTROL_PATH" -o ControlMaster=no \
            "$USER@$HOST" \
            "bash '$DEPLOY_PATH/$RELEASE/deploy/activate.sh' '$DEPLOY_PATH' '$RELEASE' '$PHP_BIN' 3 staging"

      - name: Verify staging health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://staging.intake-engine.nl/health

      - name: Close SSH ControlMaster
        if: always()
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          PORT: ${{ secrets.STAGING_SSH_PORT }}
          USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          if [ -n "${SSH_CONTROL_PATH:-}" ]; then
            ssh -O exit -p "$PORT" -o "ControlPath=$SSH_CONTROL_PATH" "$USER@$HOST" || true
          fi
